[package]
name = "omarchy-syncd"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "Trusted multi-machine continuity daemon for Omarchy"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
