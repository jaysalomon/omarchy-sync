[package]
name = "omarchy-syncd"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Trusted multi-machine continuity daemon for Omarchy"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
snow = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
